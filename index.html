<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buklux | Read with purpose. Publish with confidence.</title>
<meta name="description" content="Buklux helps writers turn ideas and manuscripts into books that readers can finish, value and recommend.">
<meta name="theme-color" content="#0B78B8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230B78B8'/%3E%3Cpath d='M16 5c3 4 6 7 6 11 0 3.500-2 6.500-6 11-4-4.500-6-7.500-6-11 0-4 3-7 6-11z' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* ==========================================================
   BUKLUX  |  Design tokens
   Change colours and fonts here and the whole site follows.
   ========================================================== */
:root{
  --paper:#FBFCFD; --mist:#F2F6F9; --sand:#F6F3EE;
  --ink:#14202B; --ink-2:#44525F; --line:#DDE5EC; --edge:#7F90A0;
  --sky:#0B78B8; --sky-600:#095F93; --sky-300:#7CC4EE; --sky-100:#E3F2FB; --sky-50:#F0F8FD;
  --danger:#B3261E;
  --serif:"Fraunces", Georgia, "Times New Roman", serif;
  --sans:"Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--sans);font-size:1.0625rem;line-height:1.6;color:var(--ink);background:var(--paper)}
svg{display:block;max-width:100%}
h1,h2,h3,h4{font-family:var(--serif);font-weight:500;line-height:1.12;letter-spacing:-.01em;margin:0;text-wrap:balance}
p{margin:0;text-wrap:pretty}
ul,ol{margin:0}
a{color:inherit}
button{font:inherit}
:focus-visible{outline:3px solid var(--sky-300);outline-offset:3px;border-radius:6px}
main:focus{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:12px;top:-60px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;z-index:100;text-decoration:none}
.skip:focus{top:12px}

.container{width:min(100% - 40px, 1180px);margin-inline:auto}
.band{padding-block:clamp(64px,9vw,112px)}
.band-mist{background:var(--mist)}
.band-sand{background:var(--sand)}
.h1{font-size:clamp(2.6rem,7.6vw,4.8rem);letter-spacing:-.02em}
.h2{font-size:clamp(1.95rem,4.8vw,3.05rem)}
.h3{font-size:1.3rem}
.lede{font-size:clamp(1.1rem,2.2vw,1.28rem);color:var(--ink-2);max-width:54ch}
.muted{color:var(--ink-2)}
.stack>*+*{margin-top:18px}
.head{max-width:680px;margin-bottom:clamp(32px,5vw,56px)}
.head .lede{margin-top:16px}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 26px;border-radius:999px;border:1.5px solid transparent;font-weight:600;font-size:1rem;text-decoration:none;cursor:pointer;transition:background-color .18s,border-color .18s,color .18s,transform .18s,box-shadow .18s;text-align:center}
.btn-primary{background:var(--sky);color:#fff}
.btn-primary:hover{background:var(--sky-600);box-shadow:0 8px 20px -8px rgba(11,120,184,.7)}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn-ghost:hover{background:var(--ink);color:#fff}
.btn-sky{background:var(--sky-300);color:var(--ink)}
.btn-sky:hover{background:#9AD3F3}
.btn-sm{min-height:42px;padding:0 20px;font-size:.95rem}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.6;cursor:progress}
.btn-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
.link-cta{display:inline-block;font-weight:600;color:var(--sky-600);text-decoration:underline;text-decoration-color:var(--sky-300);text-underline-offset:5px;text-decoration-thickness:2px;transition:text-decoration-color .15s}
.link-cta:hover{text-decoration-color:var(--sky-600)}

/* ---------- Header ---------- */
.site-header{position:sticky;top:0;z-index:50;background:rgba(251,252,253,.9);-webkit-backdrop-filter:saturate(1.4) blur(12px);backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid transparent;transition:border-color .2s}
.site-header.scrolled{border-bottom-color:var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;height:68px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--serif);font-weight:600;font-size:1.28rem;letter-spacing:-.01em}
.brand svg{width:34px;height:34px}
.menu-btn{width:46px;height:46px;border:1.5px solid var(--line);background:#fff;border-radius:14px;display:grid;place-items:center;cursor:pointer}
.menu-btn span{display:block;width:20px;height:2px;background:var(--ink);border-radius:2px;position:relative;transition:background .15s}
.menu-btn span::before,.menu-btn span::after{content:"";position:absolute;left:0;width:20px;height:2px;background:var(--ink);border-radius:2px;transition:transform .2s,top .2s}
.menu-btn span::before{top:-6px}.menu-btn span::after{top:6px}
.menu-btn[aria-expanded="true"] span{background:transparent}
.menu-btn[aria-expanded="true"] span::before{top:0;transform:rotate(45deg)}
.menu-btn[aria-expanded="true"] span::after{top:0;transform:rotate(-45deg)}
.nav{position:absolute;left:0;right:0;top:68px;background:var(--paper);border-bottom:1px solid var(--line);padding:8px 20px 24px;display:none;flex-direction:column;box-shadow:0 24px 30px -24px rgba(20,32,43,.35)}
.nav.open{display:flex}
.nav .nl{padding:15px 4px;text-decoration:none;font-weight:500;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer;color:inherit}
.nav .btn{margin-top:18px}
.nav [aria-current="page"]{color:var(--sky-600);font-weight:600}
@media (min-width:920px){
  .menu-btn{display:none}
  .nav{position:static;display:flex;flex-direction:row;align-items:center;gap:4px;padding:0;border:0;background:none;box-shadow:none}
  .nav .nl{padding:9px 14px;border:0;border-radius:999px;transition:background-color .15s}
  .nav .nl:hover{background:var(--sky-50)}
  .nav [aria-current="page"]{background:var(--sky-100)}
  .nav .btn{margin:0 0 0 10px;min-height:44px;padding:0 22px;font-size:.95rem}
}

/* ---------- Hero ---------- */
.hero{padding-block:clamp(36px,6vw,88px) clamp(56px,8vw,112px);overflow:hidden}
.hero-grid{display:grid;gap:44px;align-items:center}
.hero .lede{margin-top:22px}
.hero-visual{position:relative;width:min(100%,520px);aspect-ratio:1/1;margin-inline:auto}
.globe{position:absolute;inset:0;width:100%;height:100%}
.globe .fill{fill:var(--sky-100)}
.globe .ln{fill:none;stroke:var(--sky-300);stroke-width:1.5}
.fan-book{position:absolute;width:37%;filter:drop-shadow(0 18px 20px rgba(20,32,43,.28));animation:fan 1s cubic-bezier(.2,.8,.2,1) both}
.fan-book .cover{box-shadow:none}
.fan-1{left:7%;top:24%;--rot:-9deg;--from:55%;animation-delay:.1s}
.fan-2{left:31.5%;top:12%;--rot:0deg;--from:0%;z-index:2;animation-delay:0s}
.fan-3{left:56%;top:26%;--rot:9deg;--from:-55%;animation-delay:.1s}
.fan-book{transform:rotate(var(--rot))}
@keyframes fan{from{transform:translateX(var(--from)) rotate(0deg);opacity:0}to{transform:translateX(0) rotate(var(--rot));opacity:1}}
@media (min-width:920px){
  .hero-grid{grid-template-columns:1.08fr .92fr;gap:56px}
}

/* ---------- Intro ---------- */
.intro{display:grid;gap:36px}
.duo{display:grid;gap:16px;margin-top:30px}
.duo a{display:block;text-decoration:none;padding:26px;border-radius:22px;background:var(--sky-50);border:1px solid var(--sky-100);transition:background-color .2s,border-color .2s}
.duo a:nth-child(2){background:var(--sand);border-color:#ECE6DB}
.duo a:hover{border-color:var(--sky-300)}
.duo h3{font-size:1.35rem;margin-bottom:8px}
.duo p{color:var(--ink-2);margin-bottom:12px}
@media (min-width:900px){
  .intro{grid-template-columns:.9fr 1.1fr;gap:72px;align-items:start}
  .duo{grid-template-columns:1fr 1fr}
}

/* ---------- Services ---------- */
.svc-grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.svc{background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px;display:flex;flex-direction:column;gap:12px;transition:border-color .2s,box-shadow .2s,transform .2s}
.svc:hover{border-color:var(--sky-300);box-shadow:0 18px 30px -22px rgba(11,120,184,.55);transform:translateY(-3px)}
.svc-ico{width:48px;height:48px;border-radius:14px;background:var(--sky-100);color:var(--sky-600);display:grid;place-items:center}
.svc p{color:var(--ink-2);flex:1;font-size:1rem}
.svc .link-cta{align-self:flex-start;margin-top:6px}

/* ---------- Journey ---------- */
.journey{list-style:none;padding:0;margin:0;display:grid;gap:30px}
.step{position:relative;padding-left:68px}
.step .n{position:absolute;left:0;top:0;width:46px;height:46px;border-radius:50%;background:var(--sky);color:#fff;display:grid;place-items:center;font-family:var(--serif);font-weight:600;font-size:1.15rem}
.step::before{content:"";position:absolute;left:22px;top:52px;bottom:-26px;width:2px;background:var(--sky-300)}
.step:last-child::before{display:none}
.step h3{font-size:1.2rem;margin-bottom:6px}
.step p{color:var(--ink-2);font-size:1rem}
@media (min-width:920px){
  .journey{grid-template-columns:repeat(5,1fr);gap:28px}
  .step{padding:70px 0 0}
  .step::before{left:56px;right:-16px;top:22px;bottom:auto;width:auto;height:2px}
}

/* ---------- Books ---------- */
.grid-books{display:grid;gap:30px 24px;grid-template-columns:1fr}
@media (min-width:640px){.grid-books{grid-template-columns:repeat(2,1fr)}}
@media (min-width:960px){.grid-books{grid-template-columns:repeat(3,1fr)}}
.book-card{display:grid;grid-template-columns:104px 1fr;gap:18px;align-items:start}
.cover-stage{display:block;text-decoration:none}
.cover{display:block;width:100%;height:auto;border-radius:3px 8px 8px 3px;box-shadow:0 1px 0 rgba(20,32,43,.06),0 16px 26px -14px rgba(20,32,43,.5),0 2px 6px rgba(20,32,43,.14);transition:transform .25s ease}
.cover-stage:hover .cover{transform:translateY(-5px)}
.book-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.pill{display:inline-block;font-size:.82rem;font-weight:600;color:var(--sky-600);background:var(--sky-100);padding:3px 11px;border-radius:999px}
.save-btn{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:#fff;color:var(--ink-2);display:grid;place-items:center;cursor:pointer;transition:color .15s,border-color .15s,background-color .15s;flex:none}
.save-btn:hover{border-color:var(--sky);color:var(--sky)}
.save-btn[aria-pressed="true"]{color:var(--sky);background:var(--sky-100);border-color:var(--sky-300)}
.save-btn[aria-pressed="true"] svg{fill:currentColor}
.book-info h3{font-size:1.22rem;margin-bottom:2px}
.book-info h3 a{text-decoration:none}
.book-info h3 a:hover{color:var(--sky-600)}
.by{font-size:.95rem;color:var(--ink-2);margin-bottom:8px}
.desc{font-size:.98rem;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:14px}
@media (min-width:640px){
  .book-card{grid-template-columns:1fr;gap:20px}
  .cover-stage{background:var(--mist);border-radius:24px;padding:34px 0;display:grid;place-items:center}
  .cover-stage .cover{width:56%}
  .band-mist .cover-stage{background:#fff}
}
.more{margin-top:44px;text-align:center}

/* ---------- Why ---------- */
.why{display:grid;gap:36px}
.why-list{list-style:none;padding:0;margin:0}
.why-list li{display:grid;grid-template-columns:40px 1fr;gap:16px;padding:22px 0;border-top:1px solid var(--line)}
.why-list li:last-child{border-bottom:1px solid var(--line)}
.tick{width:36px;height:36px;border-radius:50%;background:var(--sky-100);color:var(--sky-600);display:grid;place-items:center}
.why-list h3{font-size:1.18rem;margin-bottom:4px}
.why-list p{color:var(--ink-2);font-size:1rem}
@media (min-width:900px){.why{grid-template-columns:.8fr 1.2fr;gap:80px}.why .head{position:sticky;top:110px;align-self:start}}

/* ---------- Author CTA ---------- */
.cta-band{background:var(--ink);color:#fff;position:relative;overflow:hidden}
.cta-band .container{position:relative;z-index:1}
.cta-band .lede{color:#C9D6E0;margin-top:18px}
.cta-globe{position:absolute;right:-120px;bottom:-140px;width:420px;height:420px;opacity:.9}
.cta-globe .ln{fill:none;stroke:#2B4A60;stroke-width:1.5}
@media (min-width:900px){.cta-globe{right:-40px;width:560px;height:560px;bottom:-200px}}

/* ---------- Newsletter ---------- */
.news{display:grid;gap:28px}
.inline-form{display:grid;gap:12px}
.inline-form .field input{background:#fff}
@media (min-width:900px){.news{grid-template-columns:1fr 1fr;gap:72px;align-items:center}}
@media (min-width:560px){.inline-form.row{grid-template-columns:1fr auto;align-items:start}.inline-form.row .err{grid-column:1/-1}}

/* ---------- Page hero (inner pages) ---------- */
.page-hero{padding-block:clamp(48px,8vw,96px) clamp(32px,5vw,56px);background:linear-gradient(180deg,var(--sky-50),var(--paper))}
.page-hero .lede{margin-top:20px}

/* ---------- Authors page ---------- */
.who{display:grid;gap:14px;margin-top:34px;grid-template-columns:1fr}
.who div{padding:18px 20px;border-radius:16px;background:#fff;border:1px solid var(--line);font-weight:500}
@media (min-width:700px){.who{grid-template-columns:1fr 1fr}}
.stages{display:grid;gap:14px;grid-template-columns:1fr}
.stage{text-align:left;padding:22px;border-radius:20px;border:1.5px solid var(--line);background:#fff;cursor:pointer;color:inherit;display:grid;gap:6px;transition:border-color .18s,background-color .18s,box-shadow .18s}
.stage strong{font-family:var(--serif);font-size:1.2rem;font-weight:500}
.stage span{color:var(--ink-2);font-size:.98rem}
.stage:hover{border-color:var(--sky-300);box-shadow:0 14px 26px -22px rgba(11,120,184,.6)}
.stage[aria-pressed="true"]{border-color:var(--sky);background:var(--sky-50)}
@media (min-width:640px){.stages{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1000px){.stages{grid-template-columns:repeat(5,1fr)}}
.acc{display:grid;gap:12px}
.acc details{background:#fff;border:1px solid var(--line);border-radius:18px;padding:0 22px;transition:border-color .2s}
.acc details[open]{border-color:var(--sky-300)}
.acc summary{list-style:none;cursor:pointer;padding:20px 0;display:flex;align-items:center;justify-content:space-between;gap:16px;font-family:var(--serif);font-size:1.2rem;font-weight:500}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"+";font-family:var(--sans);font-size:1.6rem;line-height:1;color:var(--sky-600);transition:transform .2s}
.acc details[open] summary::after{transform:rotate(45deg)}
.acc .body{padding:0 0 24px;display:grid;gap:14px;color:var(--ink-2)}
.acc ul{padding-left:20px;display:grid;gap:4px}
.acc .body strong{color:var(--ink)}
.submit-wrap{display:grid;gap:36px}
.submit-card{background:#fff;border:1px solid var(--line);border-radius:28px;padding:clamp(22px,4vw,40px);box-shadow:0 30px 50px -40px rgba(20,32,43,.4)}
.next{list-style:none;padding:0;display:grid;gap:18px;margin-top:26px}
.next li{display:grid;grid-template-columns:36px 1fr;gap:14px}
.next b{width:36px;height:36px;border-radius:50%;background:var(--sky-100);color:var(--sky-600);display:grid;place-items:center;font-family:var(--serif)}
@media (min-width:980px){.submit-wrap{grid-template-columns:.7fr 1.3fr;gap:64px;align-items:start}.submit-wrap .head{margin-bottom:0}}

/* ---------- Forms ---------- */
.form-grid{display:grid;gap:20px}
.field{display:grid;gap:7px}
.field label,.legend{font-weight:600;font-size:.96rem}
.req{color:var(--sky-600)}
.field input,.field select,.field textarea{font:inherit;color:inherit;width:100%;min-height:50px;padding:12px 15px;border:1.5px solid var(--edge);border-radius:14px;background:#fff;transition:border-color .15s,box-shadow .15s}
.field textarea{min-height:140px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--sky);box-shadow:0 0 0 4px var(--sky-100)}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--danger)}
.err{color:var(--danger);font-size:.92rem}
.err:empty{display:none}
.hint{font-size:.9rem;color:var(--ink-2)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.checks{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.check{position:relative;display:inline-block}
.check input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer}
.check span{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border:1.5px solid var(--edge);border-radius:999px;font-size:.96rem;background:#fff;transition:background-color .15s,border-color .15s,color .15s}
.check:hover span{border-color:var(--sky)}
.check input:checked + span{background:var(--sky-100);border-color:var(--sky);color:var(--sky-600);font-weight:600}
.check input:focus-visible + span{outline:3px solid var(--sky-300);outline-offset:2px}
.upload{position:relative;display:grid;gap:4px;padding:22px;border:1.5px dashed var(--edge);border-radius:16px;background:var(--sky-50);text-align:center;cursor:pointer;transition:border-color .15s,background-color .15s}
.upload:hover,.upload:focus-within{border-color:var(--sky);background:var(--sky-100)}
.upload input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;min-height:0;padding:0}
.upload strong{color:var(--sky-600)}
.field.invalid .upload{border-color:var(--danger)}
.status{padding:14px 16px;border-radius:14px;font-size:.96rem}
.status[hidden]{display:none}
.status.ok{background:#E6F4EA;color:#14532D}
.status.info{background:var(--sky-100);color:#0B4A73}
.status.error{background:#FCE8E6;color:#8A1C14}
.form-actions{display:grid;gap:14px}
.fine{font-size:.88rem;color:var(--ink-2)}
@media (min-width:640px){.form-grid.two{grid-template-columns:1fr 1fr}.span-2{grid-column:1/-1}}

/* ---------- Books page ---------- */
.controls{display:grid;gap:16px;margin-bottom:12px}
.search{position:relative}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--ink-2);pointer-events:none}
.search input{width:100%;min-height:54px;padding:0 18px 0 48px;font:inherit;border:1.5px solid var(--edge);border-radius:999px;background:#fff}
.search input:focus{outline:none;border-color:var(--sky);box-shadow:0 0 0 4px var(--sky-100)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:thin}
.chip{flex:none;min-height:42px;padding:0 18px;border-radius:999px;border:1.5px solid var(--edge);background:#fff;cursor:pointer;font-weight:500;color:var(--ink);transition:background-color .15s,border-color .15s,color .15s}
.chip:hover{border-color:var(--sky)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.ctrl-row{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;justify-content:space-between}
.ctrl-row .left{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.ctrl-row select{font:inherit;min-height:42px;padding:0 14px;border:1.5px solid var(--edge);border-radius:12px;background:#fff}
.count{color:var(--ink-2);font-size:.95rem}
.shelf+.shelf{margin-top:clamp(56px,8vw,96px)}
.shelf-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:28px}
.shelf-panel{background:var(--mist);border-radius:32px;padding:clamp(24px,4vw,48px)}
.empty{padding:48px 24px;text-align:center;border:1.5px dashed var(--edge);border-radius:24px;background:#fff}
.empty p{margin:10px auto 22px;max-width:44ch;color:var(--ink-2)}
.sample-note{margin-top:14px;font-size:.92rem;color:var(--ink-2)}

/* ---------- Book detail ---------- */
.back{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:600;color:var(--sky-600);margin-bottom:28px}
.back:hover{text-decoration:underline}
.detail{display:grid;gap:40px}
.detail-stage{background:var(--mist);border-radius:32px;padding:clamp(32px,6vw,64px) 20px;display:grid;place-items:center}
.detail-stage .cover{width:min(62%,300px);transition:none}
.detail h1{margin:12px 0 8px}
.detail .by{font-size:1.1rem;margin-bottom:20px}

/* ---------- Book cover generator (all original artwork) ---------- */
function wrapTitle(t, max) {
  const out = []; let cur = "";
  t.split(" ").forEach(w => { if ((cur + " " + w).trim().length > max && cur) { out.push(cur); cur = w; } else cur = (cur + " " + w).trim(); });
  if (cur) out.push(cur); return out;
}
function patternArt(p, bg, fg, ac) {
  switch (p) {
    case "sun": return `<circle cx="150" cy="150" r="80" fill="${ac}"/><rect x="0" y="150" width="300" height="92" fill="${bg}"/>` +
      [0,1,2,3].map(i => `<rect x="${40 + i*16}" y="${168 + i*16}" width="${220 - i*32}" height="5" rx="2.500" fill="${fg}" opacity="${.9 - i*.2}"/>`).join("");
    case "waves": return [0,1,2,3,4].map(i => { const y = 52 + i*36; return `<path d="M-10 ${y} q40 -28 80 0 t80 0 t80 0 t80 0" fill="none" stroke="${i%2 ? fg : ac}" stroke-width="8" stroke-linecap="round" opacity="${i%2 ? .5 : 1}"/>`; }).join("");
    case "grid": { let s = ""; for (let r = 0; r < 4; r++) for (let c = 0; c < 5; c++) { const x = 30 + c*60 + (r%2 ? 30 : 0), y = 44 + r*50; if (x > 285) continue; const a = (r + c) % 3 === 0; s += `<rect x="${x-17}" y="${y-17}" width="34" height="34" transform="rotate(45 ${x} ${y})" fill="${a ? ac : fg}" opacity="${a ? 1 : .3}"/>`; } return s; }
    case "arch": return `<path d="M55 242V132a95 95 0 0 1 190 0V242Z" fill="${ac}"/><path d="M85 242V138a65 65 0 0 1 130 0V242Z" fill="${bg}"/><path d="M115 242V144a35 35 0 0 1 70 0V242Z" fill="${fg}" opacity=".92"/>`;
    case "stripes": return [0,1,2,3,4].map(i => `<polygon points="${-30 + i*72},242 ${30 + i*72},242 ${130 + i*72},0 ${70 + i*72},0" fill="${i%2 ? fg : ac}"/>`).join("");
    case "dots": { let s = ""; for (let r = 0; r < 4; r++) for (let c = 0; c < 6; c++) { const rad = 6 + ((r*7 + c*3) % 4) * 4; s += `<circle cx="${34 + c*46}" cy="${40 + r*54}" r="${rad}" fill="${(r + c) % 2 ? fg : ac}" opacity="${(r + c) % 2 ? .45 : 1}"/>`; } return s; }
    case "orbit": return `<circle cx="150" cy="125" r="46" fill="${ac}"/><g fill="none" stroke="${fg}" stroke-width="2.500" opacity=".85"><ellipse cx="150" cy="125" rx="112" ry="36" transform="rotate(-18 150 125)"/><ellipse cx="150" cy="125" rx="90" ry="26" transform="rotate(24 150 125)"/></g><circle cx="246" cy="96" r="7" fill="${fg}"/>`;
    case "leaf": return `<circle cx="118" cy="130" r="82" fill="${ac}" opacity=".85"/><circle cx="188" cy="130" r="82" fill="${fg}" opacity=".3"/>`;
    default: return "";
  }
}
function cover(b) {
  const [bg, fg, ac] = b.palette;
  const lines = wrapTitle(b.title, 14);
  const maxLen = Math.max(...lines.map(l => l.length));
  const fs = Math.max(20, Math.min(32, Math.floor(244 / (maxLen * .58))));
  const tspans = lines.map((l, i) => `<tspan x="30" dy="${i === 0 ? 0 : fs * 1.14}">${esc(l)}</tspan>`).join("");
  return `<svg class="cover" viewBox="0 0 300 450" role="img" aria-label="Placeholder cover for ${esc(b.title)} by ${esc(b.author)}" xmlns="http://www.w3.org/2000/svg">
    <rect width="300" height="450" fill="${bg}"/>
    ${patternArt(b.pattern, bg, fg, ac)}
    <text x="30" y="282" font-family="Fraunces, Georgia, serif" font-weight="600" font-size="${fs}" fill="${fg}">${tspans}</text>
    <text x="30" y="420" font-family="Instrument Sans, Arial, sans-serif" font-weight="600" font-size="13" letter-spacing="1.500" fill="${fg}" opacity=".85">${esc(b.author.toUpperCase())}</text>
    <rect width="12" height="450" fill="#000" opacity=".16"/><rect x="12" width="2" height="450" fill="#fff" opacity=".2"/>
  </svg>`;
}

}

/* ---------- Router ---------- */
const PAGES = {
  "": homePage, home: homePage, authors: authorsPage, books: booksPage, book: bookPage,
  about: aboutPage, contact: contactPage, privacy: () => legalPage("privacy"), terms: () => legalPage("terms"),
  account: accountPage, library: libraryPage, dashboard: authorDashboardPage, admin: adminPage
};
const pending = { service: null };

async function route() {
  const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
  const name = parts[0] || "home", arg = parts[1];
  const fn = PAGES[name] || notFound;
  let page = await fn(arg);
  if (name === "books") { const live = await liveBooksPage(); if (live) page = live; }
  $("#main").innerHTML = page.html;
  document.title = page.title ? `${page.title} | Buklux` : "Buklux | Read with purpose. Publish with confidence.";
  $$("[data-nav]").forEach(a => a.removeAttribute("aria-current"));
  const navKey = name === "book" ? "books" : name;
  const cur = $(`[data-nav="${navKey}"]`); if (cur) cur.setAttribute("aria-current", "page");
  closeMenu();
  if (name === "books") renderResults();
  if (name === "authors") applyPending();
  const target = name === "authors" && arg ? document.getElementById(arg) : null;
  if (target) { target.scrollIntoView({ behavior: reduceMotion() ? "auto" : "smooth", block: "start" }); }
  else { window.scrollTo(0, 0); $("#main").focus({ preventScroll: true }); }
}
function applyPending() {
  if (!pending.service) return;
  const cb = $$('input[name="help"]').find(i => i.value === pending.service);
  if (cb) cb.checked = true;
  pending.service = null;
}

/* ---------- Menu ---------- */
const menuBtn = $("#menuBtn"), nav = $("#nav");
function closeMenu() { nav.classList.remove("open"); menuBtn.setAttribute("aria-expanded", "false"); menuBtn.setAttribute("aria-label", "Open menu"); }
menuBtn.addEventListener("click", () => {
  const open = nav.classList.toggle("open");
  menuBtn.setAttribute("aria-expanded", open); menuBtn.setAttribute("aria-label", open ? "Close menu" : "Open menu");
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeMenu(); });
addEventListener("scroll", () => $("#header").classList.toggle("scrolled", scrollY > 8), { passive: true });

/* ---------- Toast + modal ---------- */
let toastTimer;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 3200); }
const modal = $("#modal");
function openModal(html) { $("#modal-body").innerHTML = html; if (modal.showModal) modal.showModal(); else modal.setAttribute("open", ""); }
function closeModal() { if (modal.close) modal.close(); else modal.removeAttribute("open"); }
modal.addEventListener("click", e => { if (e.target === modal) closeModal(); });

  const bookRows = (books||[]).map(b=>`<article class="market-book"><h3>${esc(b.title)}</h3><p>${esc(b.author_name)} · ${money(b.price_minor)}</p><p>Status: <strong>${esc(b.status)}</strong></p>${b.admin_note?`<p class="market-small">${esc(b.admin_note)}</p>`:""}<label>Admin note<input data-admin-note="${b.id}" value="${esc(b.admin_note||"")}"></label><div class="market-actions">${b.status!=="approved"?`<button class="btn btn-primary btn-sm" data-admin-book="${b.id}" data-status="approved">Approve</button>`:""}${b.status!=="rejected"?`<button class="btn btn-ghost btn-sm" data-admin-book="${b.id}" data-status="rejected">Reject</button>`:""}</div></article>`).join("");
  const requestRows=(requests||[]).map(r=>`<article class="market-book"><h3>${esc(r.request_type)} request</h3><p>${esc(r.name)} · ${esc(r.email)}</p><p class="market-small">${esc(JSON.stringify(r.details||{}))}</p><p>Status: ${esc(r.status)}</p><select data-request-status="${r.id}"><option ${r.status==="new"?"selected":""}>new</option><option ${r.status==="in_review"?"selected":""}>in_review</option><option ${r.status==="contacted"?"selected":""}>contacted</option><option ${r.status==="accepted"?"selected":""}>accepted</option><option ${r.status==="completed"?"selected":""}>completed</option><option ${r.status==="declined"?"selected":""}>declined</option></select><button class="btn btn-ghost btn-sm" data-request-save="${r.id}">Update request</button></article>`).join("");
  return marketplaceShell("Buklux admin dashboard","Review books and manage incoming service/contact requests.",`${be?statusMarkup(be.message,"error"):""}${re?statusMarkup(re.message,"error"):""}<div class="market-card"><h2 class="h2">Book submissions</h2><div class="market-grid">${bookRows||"<p>No book submissions yet.</p>"}</div></div><div class="market-card"><h2 class="h2">Incoming requests</h2><div class="market-grid">${requestRows||"<p>No requests found.</p>"}</div></div><p class="market-small">Admin access is also enforced by Supabase row-level security policies; this email check is only the interface gate.</p>`);
}
async function liveBooksPage() {
  if (!sb) return null;
  const {data,error}=await sb.from("global_pen_books").select("id,title,author_name,description,category,price_minor,currency,cover_path").eq("status","approved").order("created_at",{ascending:false});
  if(error) return marketplaceShell("Explore books","Browse books approved by Buklux.",statusMarkup(error.message,"error"));
  const body=(data||[]).length?`<div class="market-grid">${data.map(b=>`<article class="market-book">${b.cover_path?`<p class="market-small">Cover image available</p>`:""}<h3>${esc(b.title)}</h3><p class="muted">by ${esc(b.author_name)}</p><p>${esc(b.description||"")}</p><p class="price">${money(b.price_minor,b.currency)}</p><button class="btn btn-primary" data-live-buy="${b.id}">Buy book</button></article>`).join("")}</div>`:`<div class="market-card"><p>No books have been approved yet. Check back soon, or sign up as an author to submit your book.</p><button class="btn btn-primary" data-action="signin">Join Buklux</button></div>`;
  return marketplaceShell("Explore books","Discover books approved for the Buklux marketplace.",body);
}
async function openCheckout(id) {
  if (!sb) { openModal(`<h2 class="h3" id="modal-title">Payments are not connected yet</h2>${connectionNotice()}<p>Complete the Supabase setup before purchasing books.</p>`); return; }
  const {data:{user}}=await sb.auth.getUser();
  if(!user){openSignIn();return;}
  openModal(`<h2 class="h3" id="modal-title">Starting secure checkout…</h2><p>You will be redirected to Paystack. Buklux will only add the book to your library after the payment is verified by the server.</p>`);
  try {
    const {data:{session}}=await sb.auth.getSession();
    const response=await fetch('/.netlify/functions/paystack-initialize',{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${session.access_token}`},body:JSON.stringify({bookId:id})});
    const result=await response.json();
    if(!response.ok||!result.authorization_url) throw new Error(result.error||'Could not start checkout.');
    location.href=result.authorization_url;
  } catch(err) { openModal(`<h2 class="h3" id="modal-title">Checkout could not start</h2><p>${esc(err.message||"Please try again later.")}</p><button class="btn btn-primary" data-action="close-modal">Close</button>`); }
}
async function handleAuthSubmit(form, mode) {
  const status=$("#auth-status",form); status.hidden=false; status.className="market-status"; status.textContent="Working…";
  if(!sb){status.className="market-status error";status.textContent="Add the Supabase anon/publishable key to connect accounts.";return;}
  const fd=new FormData(form), email=String(fd.get("email")||"").trim(), password=String(fd.get("password")||""), role=String(fd.get("role")||"reader"); currentRole=role;
  const result=mode==="signup"?await sb.auth.signUp({email,password,options:{data:{buklux_role:role}}}):await sb.auth.signInWithPassword({email,password});
  if(result.error){status.className="market-status error";status.textContent=result.error.message;return;}
  if(mode==="signup"&&!result.data.session){status.className="market-status ok";status.textContent="Account created. Check your email to confirm your address, then sign in.";return;}
  currentUser=result.data.user||null;status.className="market-status ok";status.textContent="Signed in successfully.";setTimeout(()=>{closeModal();location.hash="#/account";route();},400);
}
async function submitBook(form) {
  const out=$("#book-submit-status",form);out.hidden=false;out.className="market-status";out.textContent="Submitting…";
  if(!sb){out.className="market-status error";out.textContent="Supabase is not configured.";return;}
  const {data:{user}}=await sb.auth.getUser();

if(!user){
  out.className="market-status error";
  out.textContent="Please sign in first.";
  return;
}

const role = user.user_metadata?.buklux_role || "reader";

if(role !== "author"){
  out.className="market-status error";
  out.textContent="Your account is registered as a Reader. Become an Author to submit a book.";
  return;
}
  const fd=new FormData(form), epub=fd.get("epub"), pdf=fd.get("pdf"), coverFile=fd.get("cover");
  if((!epub||!epub.size)&&(!pdf||!pdf.size)){out.className="market-status error";out.textContent="Please upload an EPUB or PDF file.";return;}
  if((epub?.size||0)>50*1024*1024||(pdf?.size||0)>50*1024*1024||(coverFile?.size||0)>8*1024*1024){out.className="market-status error";out.textContent="Book files must be under 50 MB and the cover under 8 MB.";return;}
  const safeName=n=>String(n).replace(/[^a-zA-Z0-9._-]/g,"_");
  const upload=async(file,kind)=>{if(!file||!file.size)return null;const path=`${user.id}/${crypto.randomUUID()}-${safeName(file.name)}`;const {error}=await sb.storage.from("global-pen-books").upload(path,file,{upsert:false,contentType:file.type||"application/octet-stream"});if(error)throw error;return path;};
  try{
    const [epubPath,pdfPath,coverPath]=await Promise.all([upload(epub,"epub"),upload(pdf,"pdf"),upload(coverFile,"cover")]);
    const payload={author_id:user.id,title:String(fd.get("title")).trim(),subtitle:String(fd.get("subtitle")||"").trim(),description:String(fd.get("description")).trim(),author_name:String(fd.get("author_name")).trim(),category:String(fd.get("category")||"General").trim(),price_minor:Math.round(Number(fd.get("price_naira")||0)*100),currency:"NGN",epub_path:epubPath,pdf_path:pdfPath,cover_path:coverPath,status:"pending"};
    const {error}=await sb.from("global_pen_books").insert(payload);if(error)throw error;
    out.className="market-status ok";out.textContent="Book submitted. It will appear in the catalogue only after admin approval.";form.reset();
  }catch(err){out.className="market-status error";out.textContent=`Could not submit the book: ${err.message||"Please try again."}`;}
}
async function handleAdminBook(button){if(!sb)return;const id=button.dataset.adminBook,status=button.dataset.status,note=$(`[data-admin-note="${id}"]`)?.value||"";button.disabled=true;const {error}=await sb.from("global_pen_books").update({status,admin_note:note}).eq("id",id);if(error)toast(`Update failed: ${error.message}`);else{toast(`Book ${status}.`);route();}}
async function handleRequestUpdate(button){if(!sb)return;const id=button.dataset.requestSave,status=$(`[data-request-status="${id}"]`)?.value;const {error}=await sb.from("global_pen_requests").update({status}).eq("id",id);if(error)toast(`Update failed: ${error.message}`);else toast("Request updated.");}

/* ---------- Saved books ---------- */
function toggleSave(id) {
  const list = saved(); const i = list.indexOf(id);
  if (i > -1) list.splice(i, 1); else list.push(id);
  store.set("tgp.saved", list);
  const on = i === -1;
  $$(`[data-action="save"][data-id="${id}"]`).forEach(btn => {
    btn.setAttribute("aria-pressed", on);
    if (btn.id === "save-detail") btn.textContent = on ? "Saved" : "Save for later";
  });
  toast(on ? "Saved. Find it under Saved books." : "Removed from saved books.");
  if ($("#results") && state.savedOnly) renderResults();
}

/* ---------- Click handling ---------- */
document.addEventListener("click", e => {
  const skip = e.target.closest('a.skip');
  if (skip) { e.preventDefault(); $("#main").focus(); return; }
  const link = e.target.closest('a[href^="#/"]');
  if (link) {
    if (link.dataset.service) pending.service = link.dataset.service;
    if (link.getAttribute("href") === location.hash || (link.getAttribute("href") === "#/" && !location.hash)) { e.preventDefault(); route(); return; }
  }
  const soc = e.target.closest("a[data-social]");
  if (soc && soc.getAttribute("href") === "#") { e.preventDefault(); toast("Add your profile link in CONFIG to turn this on."); return; }
  const el = e.target.closest("[data-action],[data-live-buy],[data-admin-book],[data-request-save]"); if (!el) return;
  const a = el.dataset.action;
  if (a === "save") toggleSave(el.dataset.id);
  else if (a === "buy") openCheckout(el.dataset.id);
  else if (a === "signin") { closeMenu(); openSignIn(); }
  else if (a === "signout") { if(sb) sb.auth.signOut().then(()=>{currentUser=null;toast("Signed out.");location.hash="#/";route();}); }
  else if (a === "close-modal") closeModal();
  else if (a === "genre") { state.genre = el.dataset.genre; $$('[data-action="genre"]').forEach(c => c.setAttribute("aria-pressed", c === el)); renderResults(); }
  else if (a === "saved-toggle") { state.savedOnly = !state.savedOnly; el.setAttribute("aria-pressed", state.savedOnly); renderResults(); }
  else if (a === "clear-filters") { state.q = ""; state.genre = "All"; state.savedOnly = false; route(); }
  else if (a === "stage") {
    const s = STAGES[el.dataset.stage];
    $$('[data-action="stage"]').forEach(c => c.setAttribute("aria-pressed", c === el));
    $("#a-stage").value = s.select;
    $$('input[name="help"]').forEach(i => i.checked = s.help.includes(i.value));
    $("#submit").scrollIntoView({ behavior: reduceMotion() ? "auto" : "smooth", block: "start" });
  } else if (el.hasAttribute("data-live-buy")) { openCheckout(el.dataset.liveBuy); }
  else if (el.hasAttribute("data-admin-book")) { handleAdminBook(el); }
  else if (el.hasAttribute("data-request-save")) { handleRequestUpdate(el); }
});
document.addEventListener("input", e => {
  if (e.target.id === "q") { state.q = e.target.value; renderResults(); }
});
document.addEventListener("change", e => {
  if (e.target.id === "sort") { state.sort = e.target.value; renderResults(); }
  if (e.target.id === "a-file") checkFile(e.target);
});

/* ---------- Forms ---------- */
function checkFile(input) {
  const f = input.files[0], err = $("#a-file-err"), name = $("#a-file-name"), wrap = input.closest("[data-field]");
  let msg = "";
  if (f) {
    if (f.size > CONFIG.maxUploadMB * 1024 * 1024) msg = `That file is larger than ${CONFIG.maxUploadMB} MB. Choose a smaller file or send it by email.`;
    else if (!/\.(docx?|pdf|txt|rtf|odt)$/i.test(f.name)) msg = "Choose a Word, PDF, text or RTF file.";
  }
  if (msg) input.value = "";
  name.textContent = !msg && f ? `${f.name} (${(f.size / 1048576).toFixed(1)} MB)` : "Choose a file";
  err.textContent = msg; wrap.classList.toggle("invalid", !!msg);
  return msg;
}
function validate(form) {
  let first = null;
  $$("[data-field]", form).forEach(wrap => {
    const input = $("input,select,textarea", wrap), err = $(".err", wrap); if (!input || input.type === "file") return;
    let msg = "";
    if (input.required && !input.value.trim()) msg = input.dataset.msg || "This field is required.";
    else if (input.type === "email" && input.value && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(input.value.trim())) msg = "Enter a valid email address, like name@example.com.";
    else if (input.type === "number" && input.value !== "" && Number(input.value) < 0) msg = "Enter a number that is zero or higher.";
    err.textContent = msg; wrap.classList.toggle("invalid", !!msg); input.setAttribute("aria-invalid", msg ? "true" : "false");
    if (msg && !first) first = input;
  });
  const file = $('input[type="file"]', form);
  if (file && checkFile(file) && !first) first = file;
  return first;
}
function setStatus(form, type, text) { const s = $(".status", form); s.hidden = false; s.className = "status " + type; s.textContent = text; }
const MESSAGES = {
  author: "Thank you. Your project is in. We will reply by email soon.",
  contact: "Message sent. We will get back to you soon.",
  newsletter: "You are on the list. Watch your inbox."
};
async function savePublicRequest(form, kind) {
  const fd = new FormData(form); const values = {};
  for (const [key,value] of fd.entries()) { if (key === "_gotcha" || key === "manuscript") continue; if (key === "help") { (values.help ||= []).push(String(value)); } else if (typeof value === "string" && value.trim()) values[key] = value.trim(); }
  let manuscriptPath = null; const file = fd.get("manuscript");
  if (kind === "author" && file && file.size) {
    if (file.size > CONFIG.maxUploadMB * 1024 * 1024) throw new Error(`The manuscript must be under ${CONFIG.maxUploadMB} MB.`);
    const path = `public/${crypto.randomUUID()}-${String(file.name).replace(/[^a-zA-Z0-9._-]/g,"_")}`;
    const {error:uploadError}=await sb.storage.from("global-pen-manuscripts").upload(path,file,{upsert:false,contentType:file.type||"application/octet-stream"});
    if(uploadError) throw uploadError; manuscriptPath=path;
  }
  const requestType = kind === "author" ? "author" : kind === "contact" ? "contact" : "newsletter";
  const name = values.full_name || values.name || values.email || "Website visitor";
  const {error}=await sb.from("global_pen_requests").insert({request_type:requestType,name,email:values.email||"",details:values,manuscript_path:manuscriptPath,status:"new"});
  if(error) throw error;
}
document.addEventListener("submit", async e => {
  if(e.target.id === "auth-form") { e.preventDefault(); const mode=e.submitter?.dataset.authMode||"signin"; await handleAuthSubmit(e.target,mode); return; }
  if(e.target.id === "profile-form") { e.preventDefault(); if(!sb)return; const {data:{user}}=await sb.auth.getUser(); if(!user)return; const fd=new FormData(e.target); const out=$("#profile-status");out.hidden=false;const {error}=await sb.from("global_pen_author_profiles").upsert({user_id:user.id,display_name:String(fd.get("display_name")||"").trim(),bio:String(fd.get("bio")||"").trim(),updated_at:new Date().toISOString()},{onConflict:"user_id"});out.className="market-status "+(error?"error":"ok");out.textContent=error?error.message:"Profile saved.";return; }
  if(e.target.id === "book-submit-form") { e.preventDefault(); await submitBook(e.target); return; }
  const form = e.target.closest("form[data-form]"); if (!form) return;
  e.preventDefault();
  const kind = form.dataset.form;
  const bad = validate(form);
  if (bad) { bad.focus(); setStatus(form, "error", "Some details need attention. Check the highlighted fields and try again."); return; }
  if ($('[name="_gotcha"]', form).value) return; /* spam trap */
  const btn = $('[type="submit"]', form), label = btn.textContent;
  btn.disabled = true; btn.textContent = "Sending...";
  const endpoint = CONFIG.endpoints[kind];
  if (!endpoint) {
    if (sb) {
      try { await savePublicRequest(form, kind); setStatus(form, "ok", MESSAGES[kind]); form.reset(); const fn=$("#a-file-name"); if(fn)fn.textContent="Choose a file"; }
      catch(err) { setStatus(form, "error", `Your request was not saved: ${err.message||"Please try again."}`); }
    } else {
      await sleep(250);
      setStatus(form, "info", "The form is ready, but Buklux still needs the Supabase public key to receive submissions.");
    }
    btn.disabled = false; btn.textContent = label; return;
  }
  try {
    const res = await fetch(endpoint, { method: "POST", body: new FormData(form), headers: { Accept: "application/json" } });
    if (!res.ok) throw new Error("Request failed");
    setStatus(form, "ok", MESSAGES[kind]); form.reset();
    const fn = $("#a-file-name"); if (fn) fn.textContent = "Choose a file";
    $$('[data-action="stage"]').forEach(c => c.setAttribute("aria-pressed", "false"));
  } catch (err) {
    setStatus(form, "error", "Something went wrong and your message was not sent. Please try again, or email us directly.");
  }
  btn.disabled = false; btn.textContent = label;
});

/* ---------- Start ---------- */
addEventListener("hashchange", route);
renderFooter();
if (sb) sb.auth.onAuthStateChange((_event,session)=>{currentUser=session?.user||null;});
route();
</script>
